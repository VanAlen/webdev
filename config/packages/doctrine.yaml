doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # If you know your DB server version, uncomment this:
        # server_version: '16'

    orm:
        auto_generate_proxy_classes: true
        auto_mapping: true
        mappings:
            App:
                type: attribute
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
