; PERFORMANCE OPTIMIZATION - PRODUCTION
; OPcache Settings (MOST IMPORTANT)
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0           ; CRITICAL: Disable in production
opcache.revalidate_freq=0
opcache.save_comments=1
opcache.enable_cli=1                    ; Enable for Symfony commands
opcache.jit_buffer_size=100M
opcache.jit=1255
opcache.fast_shutdown=1

; Realpath cache (filesystem performance)
realpath_cache_size=32M
realpath_cache_ttl=600

; Memory and execution
memory_limit=256M
max_execution_time=30
max_input_time=60

; SESSION (for localhost)
session.save_path = "/tmp"
session.name = APP_SESSION
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.cookie_secure = 0  ; 0 for localhost
session.cookie_lifetime = 0
session.cookie_path = /
session.auto_start = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.use_trans_sid = 0

; Error reporting (minimal for prod)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On